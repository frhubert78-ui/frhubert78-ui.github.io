<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aperçu – Ma Bibliothèque en étagères</title><meta name="theme-color" content="#3b2414">
<style>
:root{--wood1:#6b3f1f;--wood2:#8a5530;--wood3:#4a2a12;--ink:#2b2018}
*{box-sizing:border-box}
html{background:#1b130c}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#f6ecdc;min-height:100vh;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:-2;background:url(https://frhubert78-ui.github.io/Bibliotheque/fond.jpg) center/cover}
.veil{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 20%,rgba(20,12,6,.25),rgba(20,12,6,.7))}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgba(30,18,9,.92),rgba(30,18,9,.75));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,220,170,.15)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:24px;margin:0;color:#f7e6c4;text-shadow:0 1px 0 #000}
.sub{font-size:12.5px;color:#d8c3a0;margin:2px 0 8px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1;min-width:0;font:600 12.5px system-ui;border:1px solid rgba(255,220,170,.35);background:rgba(255,240,220,.08);color:#f2dfbd;border-radius:9px;padding:8px 6px;cursor:pointer}
.opts button.on{background:#c8964f;color:#2b1a0a;border-color:#c8964f}
.lbl{font-size:11px;color:#bfa57d;margin:8px 0 4px;letter-spacing:.3px}
main{padding:14px 10px 60px;max-width:760px;margin:0 auto}
/* meuble */
.case{background:linear-gradient(90deg,var(--wood3),var(--wood1) 3%,var(--wood2) 50%,var(--wood1) 97%,var(--wood3));padding:10px 10px 0;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.4)}
.gname{font-family:Georgia,serif;font-size:15px;color:#f3dcb0;margin:14px 2px 6px;text-shadow:0 1px 2px #000;display:flex;justify-content:space-between}
.gname span{font-size:12px;color:#d9be8f}
.shelf{position:relative;height:var(--sh,150px);display:flex;align-items:flex-end;padding:0 8px;gap:1px;
 background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.25) 30%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#3d2311 0 7px,#432713 7px 15px,#3a210f 15px 19px);
 box-shadow:inset 0 10px 18px rgba(0,0,0,.6),inset 6px 0 10px rgba(0,0,0,.5),inset -6px 0 10px rgba(0,0,0,.5)}
.plank{height:16px;margin:0 -10px 10px;background:linear-gradient(#a8703f,#8a5530 30%,#6b3f1f 80%,#4a2a12);box-shadow:0 6px 10px rgba(0,0,0,.55);position:relative}
.plank::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(0,0,0,.07) 40px 42px,transparent 42px 90px,rgba(255,255,255,.05) 90px 92px)}
/* livres */
.bk{position:relative;flex:none;width:var(--w);height:var(--h);border:0;padding:0;cursor:pointer;border-radius:2px 2px 1px 1px;
 background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.12) 18%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.18) 80%,rgba(0,0,0,.5)),var(--c);
 box-shadow:2px 0 3px rgba(0,0,0,.45);transition:transform .25s ease,box-shadow .25s;transform-origin:bottom center}
.bk::before,.bk::after{content:"";position:absolute;left:0;right:0;height:var(--band,3px);background:var(--gold);opacity:.85}
.bk::before{top:9%;box-shadow:0 5px 0 var(--gold)}
.bk::after{bottom:7%;box-shadow:0 -5px 0 var(--gold)}
.bk.plain::before,.bk.plain::after{display:none}
.bk span{position:absolute;inset:22% 0 20%;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;
 font-family:Georgia,"Times New Roman",serif;font-size:var(--fs,11px);color:var(--tx);text-shadow:0 1px 1px rgba(0,0,0,.6);line-height:1.05;overflow:hidden;padding:0 2px;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.3px}
.bk i{position:absolute;bottom:2%;left:0;right:0;text-align:center;font:700 9px system-ui;font-style:normal;color:var(--tx);opacity:.9}
.bk.lean{transform:rotate(-9deg) translateX(4px);margin-left:6px}
.bk.out{transform:translateY(-16px);box-shadow:0 10px 16px rgba(0,0,0,.6),2px 0 3px rgba(0,0,0,.45);z-index:2}
.bk.lean.out{transform:rotate(0) translateY(-16px)}
/* fiche du dessous */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:760px;margin:0 auto;background:linear-gradient(#fbf3e4,#f1e3c8);color:var(--ink);border-radius:18px 18px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .3s ease}
.sheet.open{transform:none}
.sheet h2{font-family:Georgia,serif;margin:4px 0 2px;font-size:22px}
.sheet .au{color:#7d6a58;margin-bottom:10px}
dl{display:grid;grid-template-columns:100px 1fr;gap:6px 10px;margin:0 0 12px;font-size:14px}dt{color:#8a7560}dd{margin:0}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:11px;border-radius:11px;border:1px solid #d9c6a6;background:#efe0cd;font:600 14px system-ui;color:var(--ink)}
.btns button.p{background:#7b5131;color:#fff;border-color:#7b5131}
.grab{width:42px;height:4px;border-radius:2px;background:#cdb894;margin:0 auto 8px}
/* couverture qui s'ouvre */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,6,3,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;perspective:1200px}
.ov.open{opacity:1;pointer-events:auto}
.book3d{position:relative;width:min(78vw,320px);height:min(108vw,440px);transform-style:preserve-3d;transform:rotateY(-25deg) scale(.6);transition:transform .5s ease}
.ov.open .book3d{transform:none}
.pages{position:absolute;inset:6px 4px 6px 10px;background:repeating-linear-gradient(#fbf3e4 0 3px,#efe2c9 3px 4px);border-radius:3px 10px 10px 3px;color:var(--ink);padding:22px 18px 18px 22px;font-size:14px;overflow:auto}
.pages h2{font-family:Georgia,serif;margin:0 0 4px;font-size:21px}
.cover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;transform-origin:left center;transition:transform .7s cubic-bezier(.6,.05,.3,1) .35s;
 background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.08) 6%,transparent 12%),var(--c);box-shadow:0 18px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--tx);backface-visibility:hidden}
.cover b{font-family:Georgia,serif;font-size:24px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:12px 4px}
.cover small{margin-top:10px;font-size:14px;opacity:.9}
.ov.open.reveal .cover{transform:rotateY(-160deg)}
.hint{text-align:center;color:#e6d2ad;font-size:13px;margin:16px 0 0;text-shadow:0 1px 2px #000}
</style></head><body><div class="bg"></div><div class="veil"></div>

"BD":["#e9e2cf","#d9cfb8"],"Album jeunesse":["#e07a3a","#3a9ad0","#d04a7a","#6aa02a","#e0b020","#7a5ad0"],"Littérature jeunesse":["#8a3a6a","#2a6a8a","#a05a2a"],
"Romance":["#d06a8a","#8a4ab0","#2a9ab0","#e08a3a"],"Récit / Témoignage":["#4a4a3a","#5a4a3a"],"Essai / Sciences humaines":["#2a3a4a","#4a2a2a"]};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const light=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>165};
function look(b){const h=hash(b.t+b.a),p=PAL[b.g]||["#5a3a2a","#3a2a4a","#2a4a3a","#4a2a2a"],c=p[h%p.length],L=light(c),manga=b.g==="Manga",kid=b.g==="Album jeunesse"||b.g==="BD";
 const tomes=manga?((b.n.match(/(\d+)\s*à\s*(\d+)/)||[])[2]|0):0;
 return {c,tx:L?"#2b2018":(manga||kid?"#fff":"#e9cf8f"),gold:L?"#7b5131":(manga||kid?"rgba(255,255,255,.7)":"#c9a45a"),
  w:manga?Math.min(90,18+Math.max(1,tomes)*1.6):kid?19+h%6:21+h%17,h:manga?84:kid?(66+h%10):(76+h%22),plain:manga||kid,fs:manga?"10px":"11px",tomes}}
let mode="tout",open="fiche";
function spine(b,i,lean){const L=look(b);return `<button class="bk${L.plain?" plain":""}${lean?" lean":""}" data-i="${i}" style="--c:${L.c};--tx:${L.tx};--gold:${L.gold};--w:${L.w}px;--h:${L.h}%;--fs:${L.fs}"><span>${b.t.replace(/</g,"")}</span>${L.tomes?`<i>×${L.tomes}</i>`:""}</button>`}
function pack(list){const W=document.getElementById("m").clientWidth-36;let rows=[],row=[],w=0;
 for(const [b,i] of list){const bw=look(b).w+1;if(w+bw>W&&row.length){rows.push(row);row=[];w=0}row.push([b,i]);w+=bw}if(row.length)rows.push(row);
 return rows.map(r=>`<div class="shelf">${r.map(([b,i],k)=>spine(b,i,k===r.length-1&&r.length>3&&hash(b.t)%3===0)).join("")}</div><div class="plank"></div>`).join("")}
function draw(){const m=document.getElementById("m"),idx=B.map((b,i)=>[b,i]);document.getElementById("cnt").textContent=B.length+" livres";
 if(mode==="tout"){const s=[...idx].sort((a,b)=>(a[0].g+a[0].a).localeCompare(b[0].g+b[0].a,"fr"));m.innerHTML=`<div class="case">${pack(s)}</div>`}
 else{const g={};idx.forEach(x=>(g[x[0].g]=g[x[0].g]||[]).push(x));m.innerHTML=Object.keys(g).sort((a,b)=>g[b].length-g[a].length).map(k=>`<div class="gname">${k}<span>${g[k].length} livre${g[k].length>1?"s":""}</span></div><div class="case">${pack(g[k].sort((a,b)=>a[0].a.localeCompare(b[0].a,"fr")))}</div>`).join("")}}
function show(i,el){const b=B[i],L=look(b);document.querySelectorAll(".bk.out").forEach(x=>x.classList.remove("out"));el.classList.add("out");
 const info=`<dl><dt>Éditeur</dt><dd>${b.e}</dd>${b.c?`<dt>Collection</dt><dd>${b.c}</dd>`:""}<dt>Genre</dt><dd>${b.g}</dd><dt>Âge</dt><dd>${b.age}</dd>${b.n?`<dt>Note</dt><dd>${b.n}</dd>`:""}</dl>`;
 setTimeout(()=>{if(open==="fiche"){document.getElementById("sc").innerHTML=`<h2>${b.t}</h2><div class="au">${b.a}</div>${info}`;document.getElementById("sheet").classList.add("open")}
 else{const cv=document.getElementById("cv");cv.style.cssText=`--c:${L.c};--tx:${L.tx};--gold:${L.gold}`;cv.innerHTML=`<b>${b.t}</b><small>${b.a}</small>`;
  document.getElementById("pg").innerHTML=`<h2>${b.t}</h2><div style="color:#7d6a58;margin-bottom:10px">${b.a}</div>${info}<div class="btns"><button>Modifier</button><button class="p">Déplacer</button></div>`;
  const ov=document.getElementById("ov");ov.classList.add("open");requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add("reveal")))}},280)}
document.addEventListener("click",e=>{const bk=e.target.closest(".bk");
 if(bk){show(+bk.dataset.i,bk);return}
 const o=e.target.closest(".opts button");if(o){o.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===o));if(o.parentNode.id==="o1"){mode=o.dataset.v;draw()}else open=o.dataset.v;return}
 if(e.target.id==="ov"){const ov=e.target;ov.classList.remove("reveal");setTimeout(()=>ov.classList.remove("open"),500);document.querySelectorAll(".bk.out").forEach(x=>x.classList.remove("out"));return}
 if(!e.target.closest(".sheet")){document.getElementById("sheet").classList.remove("open");document.querySelectorAll(".bk.out").forEach(x=>x.classList.remove("out"))}});
addEventListener("resize",draw);draw();
</script></body></html>
