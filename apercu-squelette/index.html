const parseM=s=>s?s.split(",").map(x=>{const [k,r]=x.split(":"),side=r.slice(-1),[a,b]=r.slice(0,-1).split("-").map(Number);return [k,a,b,side]}):[];
const MPARSED={};for(const k in MUSC)MPARSED[k]=parseM(MUSC[k][0]);
const f1=v=>v.toFixed(1);
function sg2(p,a,b){const ax=p[a*2],ay=p[a*2+1],bx=p[b*2],by=p[b*2+1],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1;return {ax,ay,bx,by,dx:dx/L,dy:dy/L,L,nx:dy/L,ny:-dx/L}}
function limb2(p,a,b,w1,w2,fill){const s=sg2(p,a,b),q=[[s.ax+s.nx*w1/2,s.ay+s.ny*w1/2],[s.bx+s.nx*w2/2,s.by+s.ny*w2/2],[s.bx-s.nx*w2/2,s.by-s.ny*w2/2],[s.ax-s.nx*w1/2,s.ay-s.ny*w1/2]];
 return `<polygon points="${q.map(v=>f1(v[0])+","+f1(v[1])).join(" ")}" fill="${fill}"/><circle cx="${f1(s.ax)}" cy="${f1(s.ay)}" r="${f1(w1/2)}" fill="${fill}"/><circle cx="${f1(s.bx)}" cy="${f1(s.by)}" r="${f1(w2/2)}" fill="${fill}"/>`}
const LW={1:[7.4,5.4],3:[5.6,4],2:[12.5,7.6],7:[7.8,5]};
function segW(a,b){return a===1&&b===2?16:a===2?12.5:a===1?7.2:(b===8||b===10)?7.8:5.6}
function muscle2(p,m,act){const [k,a,b,side]=m,[t,len,wd]=MSH[k],s=sg2(p,a,b),sg=side==="F"?1:-1,w=segW(a,b),off=TORSO.has(k)?w*.38:w*.24;
 const cx=s.ax+(s.bx-s.ax)*t+s.nx*off*sg,cy=s.ay+(s.by-s.ay)*t+s.ny*off*sg,ang=Math.atan2(s.dy,s.dx)*180/Math.PI,rx=s.L*len/2,ry=w*wd*.62;
 return `<g transform="translate(${f1(cx)} ${f1(cy)}) rotate(${f1(ang)})" opacity="${(0.18+0.82*act).toFixed(2)}"><ellipse rx="${f1(rx)}" ry="${f1(ry)}" fill="${GL}" filter="url(#mglow)"/><ellipse rx="${f1(rx*.8)}" ry="${f1(ry*.7)}" fill="#d8ff9e" opacity=".55"/></g>`}
function propSVG(p,pr){if(!pr)return "";
 const mx=(p[8]+p[12])/2,my=(p[9]+p[13])/2;
 if(pr==="ball")return `<circle cx="${f1(mx)}" cy="${f1(my-4)}" r="6" fill="#c0522f" stroke="#7a2e16" stroke-width=".8"/>`;
 if(pr==="kb")return `<rect x="${f1(mx-4.5)}" y="${f1(my-4)}" width="9" height="10" rx="2.5" fill="#2a2e35" stroke="#666" stroke-width=".6"/>`;
 if(pr==="kb2")return `<rect x="${f1(p[12]-4)}" y="${f1(p[13])}" width="8" height="8" rx="2" fill="#2a2e35" stroke="#666" stroke-width=".6"/>`;
 if(pr.startsWith("wall:")){const a=pr.slice(5);return `<rect x="${a-1.5}" y="4" width="3" height="90" fill="#3a4350"/>`}
 if(pr==="pad")return `<rect x="84" y="15" width="10" height="21" rx="3" fill="#c0392b" stroke="#7a1f16" stroke-width=".8"/>`;
 if(pr==="mat")return `<rect x="3" y="91.5" width="94" height="3" rx="1.5" fill="#2f5d4a"/>`;
 if(pr==="tread")return `<rect x="8" y="91" width="84" height="4" rx="2" fill="#2a2e35"/><polyline points="82,92 78,40 70,40" stroke="#4a525c" stroke-width="2.5" fill="none"/>`;
 if(pr==="tread2")return `<polygon points="8,95 92,82 92,86 8,99" fill="#2a2e35"/><polyline points="82,83 78,36 70,36" stroke="#4a525c" stroke-width="2.5" fill="none"/>`;
 return ""}
function anatSVG(p,mus,act,pr){
 const NEAR="url(#skin)",FAR="#8a5d43",SHORT="#1d2026";
 const s=sg2(p,1,2),n=[s.nx,s.ny],S=[p[2],p[3]],H=[p[4],p[5]],at=(t,o)=>[S[0]+(H[0]-S[0])*t+n[0]*o,S[1]+(H[1]-S[1])*t+n[1]*o],P=q=>f1(q[0])+","+f1(q[1]);
 const M=f=>mus.filter(f).map(m=>muscle2(p,m,act)).join("");
 const behind=pr==="kb2"||pr==="mat"||(pr&&pr.startsWith("tread"))||(pr&&pr.startsWith("wall"));
 let x=behind?propSVG(p,pr):"";
 x+=limb2(p,1,3,...LW[1],FAR)+limb2(p,3,4,...LW[3],FAR)+limb2(p,2,7,...LW[2],FAR)+limb2(p,7,8,...LW[7],FAR)+M(m=>[3,4,7,8].includes(m[2]));
 x+=`<path d="M${P(at(-.06,7.5))} Q${P(at(.3,10.5))} ${P(at(.62,7))} L${P(at(1,7))} L${P(at(1.06,-8.2))} Q${P(at(.55,-7.4))} ${P(at(0,-8.6))} Q${P(at(-.12,0))} ${P(at(-.06,7.5))} Z" fill="${NEAR}"/>`+M(m=>m[1]===1&&m[2]===2);
 x+=`<circle cx="${f1(H[0])}" cy="${f1(H[1])}" r="9" fill="${SHORT}"/>`+limb2(p,2,9,...LW[2],NEAR)+limb2(p,9,10,...LW[7],NEAR);
 const t=sg2(p,2,9);x+=`<polygon points="${P([H[0]+t.nx*6.6,H[1]+t.ny*6.6])} ${P([H[0]+t.dx*t.L*.42+t.nx*6.2,H[1]+t.dy*t.L*.42+t.ny*6.2])} ${P([H[0]+t.dx*t.L*.42-t.nx*6.2,H[1]+t.dy*t.L*.42-t.ny*6.2])} ${P([H[0]-t.nx*6.6,H[1]-t.ny*6.6])}" fill="${SHORT}"/>`;
 x+=M(m=>m[2]===9||m[2]===10);
 x+=`<path d="M${P(S)} L${f1(p[0])},${f1(p[1]+3)}" stroke="#c99470" stroke-width="5" stroke-linecap="round"/><ellipse cx="${f1(p[0])}" cy="${f1(p[1])}" rx="5.2" ry="6" fill="url(#skin)"/>`;
 x+=limb2(p,1,5,...LW[1],NEAR)+limb2(p,5,6,...LW[3],NEAR)+M(m=>m[2]===5||m[2]===6);
 if(!behind)x+=propSVG(p,pr);
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="skin" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f1c9a5"/><stop offset=".6" stop-color="#d49d77"/><stop offset="1" stop-color="#a8714f"/></radialGradient><filter id="mglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <rect x="0" y="86" width="100" height="14" fill="${GL}" opacity=".07"/><line x1="4" y1="93.5" x2="96" y2="93.5" stroke="${GL}" stroke-opacity=".35" stroke-width=".8"/>${x}</svg>`}
function actAt(id,now){const an=ANIM[id]||[[EX[id]?EX[id][1]:"debout"],4],n=an[0].length,acts=(MUSC[id]||["",[]])[1];
 const A=i=>acts.length?acts[Math.min(i,acts.length-1)]:(i%2?1:.3);if(n===1||reduceMotion)return A(Math.min(1,n-1));
 const ph=((now/1000)%an[1])/an[1]*n,i=Math.floor(ph),f=ph-i,e=(1-Math.cos(Math.PI*f))/2;return A(i)+(A((i+1)%n)-A(i))*e}

/* ===== Squelette articulé façon mannequin 3D ===== */
const SK={skull:"#9cc7dc",neck:"#8fb3cf",rib:"#e3a487",spine:"#e28f8f",pelvis:"#b9d88e",uarm:"#9fdcc4",farm:"#a7a4e0",hand:"#efb08f",thigh:"#9fdcc4",knee:"#d79bd0",shin:"#c9c98c",foot:"#e6a3c8",joint:"#e8c6a0"};
const ZONE={quad:"thigh",ischio:"thigh",fess:"pelvis",mollet:"shin",delt:"shoulder",tri:"uarm",bic:"uarm",avb:"farm",psoas:"pelvis",lomb:"rib",obl:"rib",abdo:"rib",pec:"rib",dos:"rib"};
function shade(id,c){return `<radialGradient id="${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity="1"/></radialGradient>`}
function bone(p,a,b,w1,w2,fill,glow){const s=sg2(p,a,b),wm=Math.min(w1,w2)*.62,q=[[s.ax+s.nx*w1/2,s.ay+s.ny*w1/2],[s.ax+s.dx*s.L*.5+s.nx*wm/2,s.ay+s.dy*s.L*.5+s.ny*wm/2],[s.bx+s.nx*w2/2,s.by+s.ny*w2/2],[s.bx-s.nx*w2/2,s.by-s.ny*w2/2],[s.ax+s.dx*s.L*.5-s.nx*wm/2,s.ay+s.dy*s.L*.5-s.ny*wm/2],[s.ax-s.nx*w1/2,s.ay-s.ny*w1/2]];
 const d=`M${f1(q[0][0])},${f1(q[0][1])} Q${f1(q[1][0])},${f1(q[1][1])} ${f1(q[2][0])},${f1(q[2][1])} L${f1(q[3][0])},${f1(q[3][1])} Q${f1(q[4][0])},${f1(q[4][1])} ${f1(q[5][0])},${f1(q[5][1])} Z`;
 return (glow?`<path d="${d}" fill="none" stroke="${GL}" stroke-width="3.2" opacity="${glow}" filter="url(#mglow)"/>`:"")+`<path d="${d}" fill="${fill}"/>`}
const ball=(x,y,r,fill,glow)=>(glow?`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r+1.4)}" fill="${GL}" opacity="${glow}" filter="url(#mglow)"/>`:"")+`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${fill}"/>`;
function skelSVG(p,mus,act,pr){
 const z={};for(const m of mus){const k=ZONE[m[0]],near=[5,6,9,10].includes(m[2])||(m[1]===1&&m[2]===2);z[k+(near?"N":"F")]=1;if(m[1]===1&&m[2]===2)z[k+"F"]=1}
 const g=k=>z[k]?(0.25+0.75*act).toFixed(2):0, F="url(#f_",N="url(#n_";
 const s=sg2(p,1,2),n=[s.nx,s.ny],S=[p[2],p[3]],H=[p[4],p[5]],at=(t,o)=>[S[0]+(H[0]-S[0])*t+n[0]*o,S[1]+(H[1]-S[1])*t+n[1]*o],P=q=>f1(q[0])+","+f1(q[1]);
 const behind=pr==="kb2"||pr==="mat"||(pr&&pr.startsWith("tread"))||(pr&&pr.startsWith("wall"));
 let x=behind?propSVG(p,pr):"";
 const leg=(k,f,pre,side)=>{const kx=p[k*2],ky=p[k*2+1],fx=p[f*2],fy=p[f*2+1],t=sg2(p,k,f);
  return bone(p,2,k,6.2,5,pre+"thigh)",g("thigh"+side))+bone(p,k,f,5,4,pre+"shin)",g("shin"+side))+ball(kx,ky,3.6,pre+"knee)")+
   `<path d="M${f1(fx-1.5)},${f1(fy-3)} Q${f1(fx+6)},${f1(fy-2.5)} ${f1(fx+9)},${f1(fy+1.8)} L${f1(fx-2.5)},${f1(fy+2)} Z" fill="${pre}foot)"/>`+ball(fx,fy-1.5,1.8,pre+"joint)")};
 const arm=(e,w,pre,side)=>bone(p,1,e,4.6,3.6,pre+"uarm)",g("uarm"+side))+bone(p,e,w,3.6,2.8,pre+"farm)",g("farm"+side))+ball(p[e*2],p[e*2+1],2.4,pre+"joint)")+
   `<ellipse cx="${f1(p[w*2]+(p[w*2]-p[e*2])*.18)}" cy="${f1(p[w*2+1]+(p[w*2+1]-p[e*2+1])*.18)}" rx="2.6" ry="3.6" transform="rotate(${f1(Math.atan2(p[w*2+1]-p[e*2+1],p[w*2]-p[e*2])*180/Math.PI-90)} ${f1(p[w*2])} ${f1(p[w*2+1])})" fill="${pre}hand)"/>`+ball(S[0],S[1],2.8,pre+"joint)",g("shoulder"+side));
 x+=arm(3,4,F,"F")+leg(7,8,F,"F");
 /* bassin */
 x+=(g("pelvisF")||g("pelvisN")?`<ellipse cx="${f1(H[0])}" cy="${f1(H[1])}" rx="9" ry="7" fill="${GL}" opacity="${g("pelvisF")||g("pelvisN")}" filter="url(#mglow)"/>`:"")+
  `<path d="M${P(at(.86,6.5))} Q${P(at(1.02,9))} ${P(at(1.14,3))} L${P(at(1.1,-6.5))} Q${P(at(.9,-8))} ${P(at(.84,-4))} Z" fill="url(#n_pelvis)"/>`;
 /* colonne + cage thoracique */
 x+=`<path d="M${f1(p[0])},${f1(p[1]+4)} Q${P(at(-.2,-3.5))} ${P(at(0,-3))} Q${P(at(.55,-4.8))} ${P(at(.95,-2))}" stroke="${SK.spine}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
 const rib=`M${P(at(-.02,4))} Q${P(at(.12,9.5))} ${P(at(.5,7.5))} L${P(at(.62,4.5))} L${P(at(.6,-4.5))} Q${P(at(.3,-6.2))} ${P(at(.02,-4.5))} Z`;
 x+=(g("ribF")?`<path d="${rib}" fill="none" stroke="${GL}" stroke-width="3.4" opacity="${g("ribF")}" filter="url(#mglow)"/>`:"")+`<path d="${rib}" fill="url(#n_rib)"/>`;
 for(const t of [.18,.3,.42])x+=`<path d="M${P(at(t,-3.5))} Q${P(at(t+.04,2))} ${P(at(t+.02,6))}" stroke="#b9765c" stroke-width=".6" fill="none" opacity=".55"/>`;
 /* cou + crâne */
 x+=`<path d="M${P(at(-.04,-1))} L${f1(p[0])},${f1(p[1]+4)}" stroke="${SK.neck}" stroke-width="2.6" stroke-linecap="round"/>`;
 const hx=p[0],hy=p[1],fw=(p[2]<=p[0]+20)?1:1;
 x+=`<ellipse cx="${f1(hx-1)}" cy="${f1(hy-1)}" rx="6.4" ry="6.6" fill="url(#n_skull)"/><path d="M${f1(hx+2)},${f1(hy+2)} Q${f1(hx+6.5*fw)},${f1(hy+2)} ${f1(hx+5.5*fw)},${f1(hy+6)} L${f1(hx+1)},${f1(hy+6.5)} Z" fill="url(#n_skull)"/><circle cx="${f1(hx+3.3*fw)}" cy="${f1(hy-.5)}" r="1.5" fill="#3a5566" opacity=".75"/>`;
 x+=leg(9,10,N,"N")+arm(5,6,N,"N");
 if(!behind)x+=propSVG(p,pr);
 let defs="";for(const [k,c] of Object.entries(SK)){defs+=shade("n_"+k,c)+shade("f_"+k,c).replace(/<stop offset="1" stop-color="([^"]+)"/,'<stop offset="1" stop-color="#5a5f6a"')}
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>${defs}<filter id="mglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <rect x="0" y="86" width="100" height="14" fill="${GL}" opacity=".06"/><line x1="4" y1="93.5" x2="96" y2="93.5" stroke="${GL}" stroke-opacity=".3" stroke-width=".8"/>${x}</svg>`}

const poseArr=k=>{const a=[...(POSES[k]||POSES.debout)];a[22]=a[22]||0;return a};
function frameAt(id,now){const an=ANIM[id],fr=an[0],n=fr.length;if(n===1)return poseArr(fr[0]);const ph=((now/1000)%an[1])/an[1]*n,i=Math.floor(ph),f=ph-i,e=(1-Math.cos(Math.PI*f))/2,a=poseArr(fr[i]),b=poseArr(fr[(i+1)%n]);return a.map((v,j)=>v+(b[j]-v)*e)}
const L=[["sq_gob","Squat gobelet"],["sq_dl","Soulevé de terre"],["bx_jab","Boxe : jab-direct"],["s_psoas","Fente basse (étirement)"],["m_chat","Chat-vache"],["b_halo","Halo au ballon"]];
document.getElementById("l").innerHTML=L.map(([id,n])=>`<div class="card"><div class="st"><div class="big" data-a="${id}"></div><div class="sm"><div data-a="${id}"></div><span>taille appli</span></div></div><h2>${n}</h2></div>`).join("");
const els=[...document.querySelectorAll("div[data-a]")];let last=0;
function loop(t){if(t-last>33){last=t;for(const el of els){const id=el.dataset.a;el.innerHTML=skelSVG(frameAt(id,t),MPARSED[id],actAt(id,t),PROPX[id])}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
