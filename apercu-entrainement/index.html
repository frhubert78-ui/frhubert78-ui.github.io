 const ph=((now/1000)%an[1])/an[1]*n,i=Math.floor(ph),f=ph-i,e=(1-Math.cos(Math.PI*f))/2,j=(i+1)%n;
 const a=poseArr(fr[i]),b=poseArr(fr[j]);return [a.map((v,k)=>v+(b[k]-v)*e),acts[i]+(acts[j]-acts[i])*e]}
